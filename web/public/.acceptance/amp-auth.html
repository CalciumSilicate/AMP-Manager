<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMP Local Accept</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f4f5; }
    iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: white; }
  </style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script>
    const params = new URLSearchParams(location.search)
    const page = params.get('page') || 'overview'
    const tab = params.get('tab') || ''
    const clickText = params.get('clickText') || ''
    const token = params.get('token') || ''
    const username = params.get('username') || 'admin'
    const isAdmin = params.get('isAdmin') || 'true'
    const pageMap = {
      'channels': '渠道管理',
      'system-settings': '系统设置',
      'purchase-center': '购买订阅',
      'redeem-management': '兑换码管理',
      'api-keys': 'API Key 管理',
      'paid-subscriptions': '付费订阅',
      'overview': '概览',
    }
    const dashboardKey = `dashboard:last-page:${isAdmin === 'true' ? 'admin' : 'user'}:${username}`

    localStorage.setItem('token', token)
    localStorage.setItem('username', username)
    localStorage.setItem('isAdmin', isAdmin)
    localStorage.setItem('mustChangePassword', 'false')
    localStorage.setItem('mustChangeUsername', 'false')
    localStorage.setItem(dashboardKey, page)

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
    const findByExactText = (root, selector, text) => Array.from(root.querySelectorAll(selector)).find((node) => (node.textContent || '').trim() === text) || null

    async function drive() {
      const frame = document.getElementById('app')
      frame.src = '/'
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }))
      await wait(5000)
      const doc = frame.contentDocument
      if (!doc) return

      const targetNav = pageMap[page]
      if (targetNav && page !== 'overview') {
        const navButton = Array.from(doc.querySelectorAll('button')).find((node) => (node.textContent || '').includes(targetNav))
        if (navButton) {
          navButton.click()
          await wait(2500)
        }
      }

      if (tab) {
        const tabButton = findByExactText(doc, '[role="tab"], button', tab)
        if (tabButton) {
          tabButton.click()
          await wait(2200)
        }
      }

      if (clickText) {
        const trigger = Array.from(doc.querySelectorAll('button')).find((node) => (node.textContent || '').trim() === clickText)
        if (trigger) {
          trigger.click()
          await wait(1800)
        }
      }

      document.body.dataset.ready = '1'
      document.title = `ready:${page}:${tab}:${clickText}`
    }

    drive().catch((error) => {
      document.body.dataset.error = String(error)
      document.title = `error:${String(error)}`
    })
  </script>
</body>
</html>
